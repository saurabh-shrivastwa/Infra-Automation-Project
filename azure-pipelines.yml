trigger: none

pool:
  vmImage: ubuntu-latest

stages:

- stage: Build
  displayName: "Terraform Build"

  jobs:

  - job: TerraformBuild
    displayName: "Terraform Job"

    steps:

    # ==========================================================
    # Install Terraform
    # ==========================================================
    - bash: |
        set -e

        TERRAFORM_VERSION="1.9.8"

        wget -q https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip

        unzip -o terraform_${TERRAFORM_VERSION}_linux_amd64.zip

        sudo mv terraform /usr/local/bin/terraform

        terraform version
      displayName: "Install Terraform"


    # ==========================================================
    # Terraform Init
    # ==========================================================
    - task: AzureCLI@2
      displayName: "Terraform Init"
      inputs:
        azureSubscription: "service-connection-ado-pipeline"
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |

          set -e

          cd "$(System.DefaultWorkingDirectory)"

          echo "Terraform working directory:"
          pwd

          echo "Terraform files:"
          ls -la

          terraform version

          terraform init \
            -backend-config="storage_account_name=pipelinestorageaccount12" \
            -backend-config="container_name=statefile" \
            -backend-config="key=tfstate"


    # ==========================================================
    # Terraform Validate
    # ==========================================================
    - task: AzureCLI@2
      displayName: "Terraform Validate"
      inputs:
        azureSubscription: "service-connection-ado-pipeline"
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |

          set -e

          cd "$(System.DefaultWorkingDirectory)"

          terraform validate


    # ==========================================================
    # Terraform Plan
    # ==========================================================
    - task: AzureCLI@2
      displayName: "Terraform Plan"
      inputs:
        azureSubscription: "service-connection-ado-pipeline"
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |

          set -e

          cd "$(System.DefaultWorkingDirectory)"

          terraform plan -out=tfplan


    # ==========================================================
    # Publish Terraform Plan
    # ==========================================================
    - task: PublishPipelineArtifact@1
      displayName: "Publishing Terraform Plan"
      inputs:
        targetPath: "$(System.DefaultWorkingDirectory)/tfplan"
        artifact: "TerraformPlan"
        publishLocation: "pipeline"