trigger: none

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Build
    displayName: "Build Stage"

    jobs:

      - job: TerraformBuild
        displayName: "Terraform Job"

        steps:

          - task: AzureCLI@2
            displayName: "Test Azure Authentication"
            inputs:
              azureSubscription: "service-connection-ado-pipeline"
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az account show
                az account get-access-token --resource https://management.azure.com/
