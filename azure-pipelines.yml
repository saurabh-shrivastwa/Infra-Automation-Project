trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

stages:
  # ==========================================
  # CI STAGE: Runs on PRs and Main Branch Commits
  # ==========================================
  - stage: CI_Validation
    displayName: 'CI - Lint, Validate & Plan'
    jobs:
      - job: Bootstrap_Backend
        displayName: 'One-Time Storage Creation'
        steps:
          - task: AzureCLI@2
            displayName: 'Create Azure Backend Infrastructure'
            inputs:
             azureSubscription: 'service-connection-ado-pipeline' # Your Service Connection Name
             scriptType: 'bash'
             scriptLocation: 'inlineScript'
             inlineScript: |
               # 1. Create management resource group
               az group create --name rg-terraform-mgmt --location eastus
          
               # 2. Create the storage account
               az storage account create --name sttfstatebackend --resource-group rg-terraform-mgmt --sku Standard_LRS --encryption-services blob
          
               # 3. Retrieve the freshly generated storage account key
               echo "Retrieving storage account connection string..."
               ACCOUNT_KEY=$(az storage account keys list --resource-group rg-terraform-mgmt --account-name sttfstatebackend --query "[0].value" --output tsv)
          
               # 4. Create the container securely using the account key
               az storage container create --name tfstate --account-name sttfstatebackend --account-key $ACCOUNT_KEY    












