# Azure DevOps Pipeline for Terraform CI/CD
# Best Practice Multi-Stage Infrastructure as Code (IaC) Pipeline

trigger:
  - main

pr:
  - main

variables:
  - name: azureServiceConnection
    value: 'service-connection-ado-pipeline' # Replace with your ADO Service Connection Name
  - name: resourceGroup
    value: 'pipeline-testing'
  - name: storageAccount
    value: 'sttfstatebackend123'
  - name: containerName
    value: 'tfstate'
  - name: tfstateKey
    value: 'terraform.tfstate'
  - name: terraformVersion
    value: 'latest'

stages:
  - stage: CI
    displayName: 'Continuous Integration (Validate & Plan)'
    jobs:
      - job: ValidateAndPlan
        displayName: 'Security Scan, Validate, and Plan'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          # 1. Install Dependencies
          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: $(terraformVersion)

          - script: |
              curl -s https://githubusercontent.com | bash
              wget https://github.com
              chmod +x tfsec-linux-amd64
              sudo mv tfsec-linux-amd64 /usr/local/bin/tfsec
              wget https://github.com
              tar -zxvf gitleaks_linux_x64.tar.gz
              sudo mv gitleaks /usr/local/bin/gitleaks
            displayName: 'Install TFLint, TFSec, and Gitleaks'

          # 2. Secret & Security Scanning
          - script: gitleaks detect --source=. --verbose
            displayName: 'Run Gitleaks Secret Scan'

          - script: tfsec .
            displayName: 'Run TFSec Static Code Analysis'

          # 3. Code Quality & Format Checks
          - task: TerraformTaskV4@4
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: $(azureServiceConnection)
              backendAzureRmResourceGroupName: $(resourceGroup)
              backendAzureRmStorageAccountName: $(storageAccount)
              backendAzureRmContainerName: $(containerName)
              backendAzureRmKey: $(tfstateKey)

          - script: terraform fmt -check
            displayName: 'Verify Terraform Formatting'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Validate'
            inputs:
              provider: 'azurerm'
              command: 'validate'

          - script: tflint --init && tflint
            displayName: 'Run TFLint Analysis'

          # 4. Speculative Plan & Artifact Archival
          - task: TerraformTaskV4@4
            displayName: 'Terraform Plan'
            inputs:
              provider: 'azurerm'
              command: 'plan'
              environmentServiceNameAzureRM: $(azureServiceConnection)
              commandOptions: '-out=$(Build.ArtifactStagingDirectory)/tfplan'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Plan Artifact'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'drop'
              publishLocation: 'Container'

  - stage: CD
    displayName: 'Continuous Deployment (Apply)'
    dependsOn: CI
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: ApplyInfrastructure
        displayName: 'Deploy Terraform Changes'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'Production' # Enables manual approvals and gates in Azure Pipelines
        strategy:
          runOnce:
            deploy:
              steps:
                # 1. Download Plan from CI Stage
                - task: DownloadBuildArtifacts@1
                  displayName: 'Download Plan Artifact'
                  inputs:
                    buildType: 'current'
                    downloadType: 'single'
                    artifactName: 'drop'
                    downloadPath: '$(System.ArtifactsDirectory)'

                # 2. Re-Install Tools
                - task: TerraformInstaller@1
                  displayName: 'Install Terraform'
                  inputs:
                    terraformVersion: $(terraformVersion)

                - script: |
                    curl -s https://githubusercontent.com | bash
                    wget https://github.com
                    chmod +x tfsec-linux-amd64
                    sudo mv tfsec-linux-amd64 /usr/local/bin/tfsec
                    wget https://github.com
                    tar -zxvf gitleaks_linux_x64.tar.gz
                    sudo mv gitleaks /usr/local/bin/gitleaks
                  displayName: 'Install TFLint, TFSec, and Gitleaks'

                # 3. Run Verification Scans Again (Immutable Best Practice)
                - script: gitleaks detect --source=. --verbose
                  displayName: 'Run Gitleaks Secret Scan'

                - script: tfsec .
                  displayName: 'Run TFSec Static Code Analysis'

                - task: TerraformTaskV4@4
                  displayName: 'Terraform Init'
                  inputs:
                    provider: 'azurerm'
                    command: 'init'
                    backendServiceArm: $(azureServiceConnection)
                    backendAzureRmResourceGroupName: $(resourceGroup)
                    backendAzureRmStorageAccountName: $(storageAccount)
                    backendAzureRmContainerName: $(containerName)
                    backendAzureRmKey: $(tfstateKey)

                - script: terraform fmt -check
                  displayName: 'Verify Terraform Formatting'

                - task: TerraformTaskV4@4
                  displayName: 'Terraform Validate'
                  inputs:
                    provider: 'azurerm'
                    command: 'validate'

                - script: tflint --init && tflint
                  displayName: 'Run TFLint Analysis'

                # 4. Generate Confirmatory Plan and Execute Auto-Approve
                - task: TerraformTaskV4@4
                  displayName: 'Terraform Plan'
                  inputs:
                    provider: 'azurerm'
                    command: 'plan'
                    environmentServiceNameAzureRM: $(azureServiceConnection)

                - task: TerraformTaskV4@4
                  displayName: 'Terraform Apply'
                  inputs:
                    provider: 'azurerm'
                    command: 'apply'
                    environmentServiceNameAzureRM: $(azureServiceConnection)
                    commandOptions: '-auto-approve $(System.ArtifactsDirectory)/drop/tfplan'
