# Azure DevOps Pipeline for Terraform CI/CD
# Best Practice Multi-Stage Infrastructure as Code (IaC) Pipeline

trigger:
  - main

pr:
  - main

variables:
  # CRITICAL: Update this placeholder with your exact Azure DevOps Service Connection Name
  - name: azureServiceConnection
    value: 'service-connection-ado-pipeline' 
  - name: resourceGroup
    value: 'pipeline-testing'
  - name: storageAccount
    value: 'sttfstatebackend123'
  - name: containerName
    value: 'tfstate'
  - name: tfstateKey
    value: 'terraform.tfstate'
  - name: terraformVersion
    value: 'latest'

stages:
  - stage: CI
    displayName: 'Continuous Integration (Validate & Plan)'
    jobs:
      - job: ValidateAndPlan
        displayName: 'Security Scan, Validate, and Plan'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          # 1. Install & Cache Third-Party Security Tooling via Explicit Binary Targets
          - script: |
              set -e
              # Install TFLint
              curl -s https://githubusercontent.com | bash
              
              # Install TFSec
              curl -s https://githubusercontent.com | bash
              
              # Install Gitleaks using the explicit GitHub Release redirect-less download URL
              curl -sSL -o gitleaks.tar.gz "https://github.com"
              tar -xzf gitleaks.tar.gz
              chmod +x gitleaks
              sudo mv gitleaks /usr/local/bin/gitleaks
            displayName: 'Install TFLint, TFSec, and Gitleaks'

          # 2. Shift-Left Security Scans
          - script: gitleaks detect --source=. --verbose
            displayName: 'Run Gitleaks Secret Scan'

          - script: tfsec .
            displayName: 'Run TFSec Static Code Analysis'

          # 3. Initialize & Quality Checks
          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: $(terraformVersion)

          - task: TerraformTaskV4@4
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: $(azureServiceConnection)
              backendAzureRmResourceGroupName: $(resourceGroup)
              backendAzureRmStorageAccountName: $(storageAccount)
              backendAzureRmContainerName: $(containerName)
              backendAzureRmKey: $(tfstateKey)

          - script: terraform fmt -check
            displayName: 'Verify Terraform Formatting'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Validate'
            inputs:
              provider: 'azurerm'
              command: 'validate'

          - script: tflint --init && tflint
            displayName: 'Run TFLint Analysis'

          # 4. Plan and Archive Binary
          - task: TerraformTaskV4@4
            displayName: 'Terraform Plan'
            inputs:
              provider: 'azurerm'
              command: 'plan'
              environmentServiceNameAzureRM: $(azureServiceConnection)
              commandOptions: '-out=$(Build.ArtifactStagingDirectory)/tfplan'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Plan Artifact'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'drop'
              publishLocation: 'Container'

  - stage: CD
    displayName: 'Continuous Deployment (Apply)'
    dependsOn: CI
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: ApplyInfrastructure
        displayName: 'Deploy Terraform Changes'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'Production' 
        strategy:
          runOnce:
            deploy:
              steps:
                # 1. Fetch Immutable Plan Artifact
                - task: DownloadBuildArtifacts@1
                  displayName: 'Download Plan Artifact'
                  inputs:
                    buildType: 'current'
                    downloadType: 'single'
                    artifactName: 'drop'
                    downloadPath: '$(System.ArtifactsDirectory)'

                # 2. Re-Install Security Core Tools
                - task: TerraformInstaller@1
                  displayName: 'Install Terraform'
                  inputs:
                    terraformVersion: $(terraformVersion)

                - script: |
                    set -e
                    curl -s https://githubusercontent.com | bash
                    curl -s https://githubusercontent.com | bash
                    curl -sSL -o gitleaks.tar.gz "https://github.com"
                    tar -xzf gitleaks.tar.gz
                    chmod +x gitleaks
                    sudo mv gitleaks /usr/local/bin/gitleaks
                  displayName: 'Install TFLint, TFSec, and Gitleaks'

                # 3. Post-Artifact Security Verification
                - script: gitleaks detect --source=. --verbose
                  displayName: 'Run Gitleaks Secret Scan'

                - script: tfsec .
                  displayName: 'Run TFSec Static Code Analysis'

                - task: TerraformTaskV4@4
                  displayName: 'Terraform Init'
                  inputs:
                    provider: 'azurerm'
                    command: 'init'
                    backendServiceArm: $(azureServiceConnection)
                    backendAzureRmResourceGroupName: $(resourceGroup)
                    backendAzureRmStorageAccountName: $(storageAccount)
                    backendAzureRmContainerName: $(containerName)
                    backendAzureRmKey: $(tfstateKey)

                - script: terraform fmt -check
                  displayName: 'Verify Terraform Formatting'

                - task: TerraformTaskV4@4
                  displayName: 'Terraform Validate'
                  inputs:
                    provider: 'azurerm'
                    command: 'validate'

                - script: tflint --init && tflint
                  displayName: 'Run TFLint Analysis'

                # 4. Target Execution using Pre-Compiled Binary
                - task: TerraformTaskV4@4
                  displayName: 'Terraform Apply'
                  inputs:
                    provider: 'azurerm'
                    command: 'apply'
                    environmentServiceNameAzureRM: $(azureServiceConnection)
                    commandOptions: '-auto-approve $(System.ArtifactsDirectory)/drop/tfplan'
