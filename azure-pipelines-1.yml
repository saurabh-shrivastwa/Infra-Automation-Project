# Azure DevOps Pipeline for Terraform CI/CD
# Best Practice Multi-Stage Infrastructure as Code (IaC) Pipeline

trigger:
  - main

pr:
  - main

variables:
  # CRITICAL: Update this placeholder with your exact Azure DevOps Service Connection Name
  - name: azureServiceConnection
    value: 'service-connection-ado-pipeline' 
  - name: resourceGroup
    value: 'pipeline-testing'
  - name: storageAccount
    value: 'sttfstatebackend123'
  - name: containerName
    value: 'tfstate'
  - name: tfstateKey
    value: 'terraform.tfstate'
  - name: terraformVersion
    value: 'latest'

stages:
  - stage: CI
    displayName: 'Continuous Integration (Validate & Plan)'
    jobs:
      - job: ValidateAndPlan
        displayName: 'Security Scan, Validate, and Plan'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          # 1. Install TFLint (Using official, reliable script)
          - script: |
              set -e
              curl -s https://githubusercontent.com | bash
            displayName: 'Install TFLint'

          # 2. Run Gitleaks via official Docker container (No downloads, no errors)
          - script: |
              docker run --rm -v $(Build.SourcesDirectory):/path zricethezav/gitleaks:latest detect --source=/path --verbose
            displayName: 'Run Gitleaks Secret Scan'

          # 3. Run TFSec via official Docker container (No downloads, no errors)
          - script: |
              docker run --rm -v $(Build.SourcesDirectory):/apps aquasec/tfsec /apps
            displayName: 'Run TFSec Static Code Analysis'

          # 4. Initialize Terraform
          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: $(terraformVersion)

          - task: TerraformTaskV4@4
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: $(azureServiceConnection)
              backendAzureRmResourceGroupName: $(resourceGroup)
              backendAzureRmStorageAccountName: $(storageAccount)
              backendAzureRmContainerName: $(containerName)
              backendAzureRmKey: $(tfstateKey)

          # 5. Format & Validate Checks
          - script: terraform fmt -check
            displayName: 'Verify Terraform Formatting'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Validate'
            inputs:
              provider: 'azurerm'
              command: 'validate'

          - script: tflint --init && tflint
            displayName: 'Run TFLint Analysis'

          # 6. Plan and Archive Binary
          - task: TerraformTaskV4@4
            displayName: 'Terraform Plan'
            inputs:
              provider: 'azurerm'
              command: 'plan'
              environmentServiceNameAzureRM: $(azureServiceConnection)
              commandOptions: '-out=$(Build.ArtifactStagingDirectory)/tfplan'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Plan Artifact'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'drop'
              publishLocation: 'Container'

  - stage: CD
    displayName: 'Continuous Deployment (Apply)'
    dependsOn: CI
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: ApplyInfrastructure
        displayName: 'Deploy Terraform Changes'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'Production' 
        strategy:
          runOnce:
            deploy:
              steps:
                # 1. Fetch Immutable Plan Artifact
                - task: DownloadBuildArtifacts@1
                  displayName: 'Download Plan Artifact'
                  inputs:
                    buildType: 'current'
                    downloadType: 'single'
                    artifactName: 'drop'
                    downloadPath: '$(System.ArtifactsDirectory)'

                # 2. Re-Install Security Core Tools
                - task: TerraformInstaller@1
                  displayName: 'Install Terraform'
                  inputs:
                    terraformVersion: $(terraformVersion)

                - script: |
                    set -e
                    curl -s https://githubusercontent.com | bash
                  displayName: 'Install TFLint'

                # 3. Post-Artifact Security Verification (Docker based)
                - script: |
                    docker run --rm -v $(Build.SourcesDirectory):/path zricethezav/gitleaks:latest detect --source=/path --verbose
                  displayName: 'Run Gitleaks Secret Scan'

                - script: |
                    docker run --rm -v $(Build.SourcesDirectory):/apps aquasec/tfsec /apps
                  displayName: 'Run TFSec Static Code Analysis'

                - task: TerraformTaskV4@4
                  displayName: 'Terraform Init'
                  inputs:
                    provider: 'azurerm'
                    command: 'init'
                    backendServiceArm: $(azureServiceConnection)
                    backendAzureRmResourceGroupName: $(resourceGroup)
                    backendAzureRmStorageAccountName: $(storageAccount)
                    backendAzureRmContainerName: $(containerName)
                    backendAzureRmKey: $(tfstateKey)

                - script: terraform fmt -check
                  displayName: 'Verify Terraform Formatting'

                - task: TerraformTaskV4@4
                  displayName: 'Terraform Validate'
                  inputs:
                    provider: 'azurerm'
                    command: 'validate'

                - script: tflint --init && tflint
                  displayName: 'Run TFLint Analysis'

                # 4. Target Execution using Pre-Compiled Binary
                - script: |
                    terraform apply -auto-approve "$(System.ArtifactsDirectory)/drop/tfplan"
                  workingDirectory: '$(Build.SourcesDirectory)'
                  displayName: 'Terraform Apply (Execute Planned Binary File)'
